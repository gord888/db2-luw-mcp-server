name: Build and publish container

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: 20.x
  SOURCE_ARTIFACT_NAME: db2-luw-mcp-source
  CONTAINER_ARTIFACT_NAME: db2-luw-mcp-image
  SOURCE_BUNDLE_FILE: db2-luw-mcp-server-source.tgz
  CONTAINER_BUNDLE_FILE: db2-luw-mcp-server-image.tar.gz
  CONTAINER_STABLE_TAG: latest
  CONTAINER_REGISTRY_LOGIN_SERVER: ${{ vars.CONTAINER_REGISTRY_LOGIN_SERVER }}
  CONTAINER_IMAGE_REPOSITORY: ${{ vars.CONTAINER_IMAGE_REPOSITORY }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.version.outputs.build_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate build version
        id: version
        shell: bash
        run: echo "build_version=$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm run test

      - name: Bundle source for container packaging
        run: |
          mkdir -p "${{ runner.temp }}/source"
          tar \
            --exclude='./node_modules' \
            --exclude='./dist' \
            --exclude='./coverage' \
            --exclude='./.git' \
            --exclude='./tmp-*.mjs' \
            -czf "${{ runner.temp }}/source/${{ env.SOURCE_BUNDLE_FILE }}" \
            .

      - name: Publish source bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/source/${{ env.SOURCE_BUNDLE_FILE }}
          if-no-files-found: error

  package-container:
    name: Package container image
    runs-on: ubuntu-latest
    needs: build
    env:
      BUILD_VERSION: ${{ needs.build.outputs.build_version }}
    steps:
      - name: Download source bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/source-artifact

      - name: Extract source bundle
        run: |
          mkdir -p "${{ runner.temp }}/source"
          tar -xzf "${{ runner.temp }}/source-artifact/${{ env.SOURCE_BUNDLE_FILE }}" -C "${{ runner.temp }}/source"

      - name: Resolve image reference
        shell: bash
        run: |
          LOGIN_SERVER="${CONTAINER_REGISTRY_LOGIN_SERVER:-ghcr.io}"
          IMAGE_REPO="${CONTAINER_IMAGE_REPOSITORY:-${GITHUB_REPOSITORY,,}}"
          IMAGE_REF="${LOGIN_SERVER}/${IMAGE_REPO}:${BUILD_VERSION}"
          echo "LOGIN_SERVER=${LOGIN_SERVER}" >> "$GITHUB_ENV"
          echo "BUILD_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"
          echo "IMAGE_REF=${IMAGE_REF}" >> "$GITHUB_ENV"

      - name: Build container image
        run: |
          docker build \
            --file "${{ runner.temp }}/source/Dockerfile" \
            --tag "${IMAGE_REF}" \
            "${{ runner.temp }}/source"

      - name: Export container image
        run: |
          mkdir -p "${{ runner.temp }}/image"
          docker save "${IMAGE_REF}" | gzip > "${{ runner.temp }}/image/${{ env.CONTAINER_BUNDLE_FILE }}"

      - name: Publish container image bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CONTAINER_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/image/${{ env.CONTAINER_BUNDLE_FILE }}
          if-no-files-found: error

  push-container:
    name: Push container image
    runs-on: ubuntu-latest
    needs: [build, package-container]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    env:
      BUILD_VERSION: ${{ needs.build.outputs.build_version }}
    steps:
      - name: Download container image bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CONTAINER_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/image-artifact

      - name: Resolve image references
        shell: bash
        run: |
          LOGIN_SERVER="${CONTAINER_REGISTRY_LOGIN_SERVER:-ghcr.io}"
          IMAGE_REPO="${CONTAINER_IMAGE_REPOSITORY:-${GITHUB_REPOSITORY,,}}"
          IMAGE_REF="${LOGIN_SERVER}/${IMAGE_REPO}:${BUILD_VERSION}"
          STABLE_REF="${LOGIN_SERVER}/${IMAGE_REPO}:${CONTAINER_STABLE_TAG}"
          echo "LOGIN_SERVER=${LOGIN_SERVER}" >> "$GITHUB_ENV"
          echo "BUILD_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"
          echo "IMAGE_REF=${IMAGE_REF}" >> "$GITHUB_ENV"
          echo "STABLE_REF=${STABLE_REF}" >> "$GITHUB_ENV"

      - name: Authenticate to container registry
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          REGISTRY_TOKEN="${GHCR_PAT:-${{ secrets.GITHUB_TOKEN }}}"
          echo "${REGISTRY_TOKEN}" | docker login "${LOGIN_SERVER}" \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Load packaged container image
        run: |
          gunzip -c "${{ runner.temp }}/image-artifact/${{ env.CONTAINER_BUNDLE_FILE }}" | docker load

      - name: Push image tags
        run: |
          docker tag "${IMAGE_REF}" "${STABLE_REF}"
          docker push "${IMAGE_REF}"
          docker push "${STABLE_REF}"

      - name: Logout from container registry
        if: always()
        run: docker logout "${LOGIN_SERVER}"
